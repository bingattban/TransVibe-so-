name: Android ARM64 native — Whisper Tiny first-model gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "setup/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  WHISPER_SHA: "d1be6fde11ac6e0407606b4e42fe72d34add8037"
  ANDROID_REPO: "bingattban/TransVibe-android-"

jobs:
  source-contract:
    name: JNI and Kotlin contract tests
    runs-on: ubuntu-24.04
    outputs:
      app_ref: ${{ steps.select.outputs.ref }}
      app_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose validated Android source (one-time foundation bootstrap)
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ] &&
            gh api "repos/$ANDROID_REPO/contents/app/src/main/cpp/whisper_jni.cpp?ref=main" > /dev/null 2>&1; then
            echo 'ref=main' >> "$GITHUB_OUTPUT"
          else
            echo 'ref=setup/transvibe-android-foundation' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch matching Android source
        uses: actions/checkout@v4
        with:
          repository: bingattban/TransVibe-android-
          ref: ${{ steps.select.outputs.ref }}
          path: android-src
          persist-credentials: false
      - name: Pin exact tested Android source commit
        id: pin
        shell: bash
        run: echo "sha=$(git -C android-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact JNI declarations before building
        run: |
          python3 tools/test_contract.py \
            android-src/app/src/main/cpp/whisper_jni.cpp \
            android-src/app/src/main/java/com/transvibe/app/nativebridge/WhisperNativeBridge.kt
      - name: Fail-closed native package unit tests (before any build)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm source is not an empty diagnostic bridge
        run: |
          grep -q 'whisper_full(' android-src/app/src/main/cpp/whisper_jni.cpp
          grep -q 'whisper_init_from_file_with_params' android-src/app/src/main/cpp/whisper_jni.cpp

  build-arm64:
    name: Build Android arm64-v8a API26 after contract tests
    needs: source-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bingattban/TransVibe-android-
          # Compile exactly the same Android SHA that passed JNI tests.
          ref: ${{ needs.source-contract.outputs.app_sha }}
          path: android-src
          persist-credentials: false
      - name: Use hosted Android SDK and install pinned NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}"
          test -f "$SDK_ROOT/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"
      - name: Get exact pinned upstream whisper.cpp source
        run: |
          git clone --quiet https://github.com/ggml-org/whisper.cpp whisper-source
          git -C whisper-source checkout --detach "${WHISPER_SHA}"
          test "$(git -C whisper-source rev-parse HEAD)" = "${WHISPER_SHA}"
      - name: Configure real CPU-only Android JNI without phone-side CMake
        run: |
          cmake -S . -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DTRANSVIBE_WHISPER_ROOT="${GITHUB_WORKSPACE}/whisper-source" \
            -DTRANSVIBE_JNI_SOURCE="${GITHUB_WORKSPACE}/android-src/app/src/main/cpp/whisper_jni.cpp"
      - name: Build real Whisper native library
        run: cmake --build build-native --target transvibe_whisper -j 2
      - name: Validate ELF64 ARM architecture, JNI exports, dependencies and 16 KiB alignment
        run: |
          set -euo pipefail
          so="$(find build-native -name libtransvibe_whisper.so -type f -print -quit)"
          test -n "$so"
          python3 tools/package_native.py \
            --so "$so" \
            --jni android-src/app/src/main/cpp/whisper_jni.cpp \
            --kotlin android-src/app/src/main/java/com/transvibe/app/nativebridge/WhisperNativeBridge.kt \
            --app-commit "$(git -C android-src rev-parse HEAD)" \
            --whisper-sha "${WHISPER_SHA}" \
            --readelf "${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --output handoff
          cat handoff/native-manifest.json
          sha256sum handoff/app/libs/arm64-v8a/libtransvibe_whisper.so > handoff/SHA256SUMS
      - name: Upload verified native artifact and provenance
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-whisper-arm64-api26
          path: handoff/
          if-no-files-found: error
          retention-days: 30

  request-android-import:
    name: Ask Android repository to create native import PR
    needs: [source-contract, build-arm64]
    # Before Android bootstrap main is intentionally only a README. The
    # one-time bootstrap job installs the native payload on the source branch.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.source-contract.outputs.app_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch only with explicit repo-scoped maintainer token
        env:
          GH_TOKEN: ${{ secrets.TRANSVIBE_ANDROID_DISPATCH_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No TRANSVIBE_ANDROID_DISPATCH_TOKEN configured; artifact is available, auto-transfer skipped."
            exit 0
          fi
          gh api -X POST "repos/bingattban/TransVibe-android-/dispatches" \
            -f event_type=transvibe_native_ready \
            -f "client_payload[run_id]=$RUN_ID" \
            -f "client_payload[head_sha]=$SOURCE_SHA"

  bootstrap-android-native:
    name: One-time verified native handoff to Android source PR
    needs: [source-contract, build-arm64]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.source-contract.outputs.app_ref == 'setup/transvibe-android-foundation'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require scoped cross-repository token
        shell: bash
        env:
          ANDROID_TOKEN: ${{ secrets.TRANSVIBE_ANDROID_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_TOKEN" || {
            echo "::error::Add TRANSVIBE_ANDROID_DISPATCH_TOKEN to TransVibe-so- (fine-grained Contents: read/write for Android repo only). No native import attempted."
            exit 1
          }
      - name: Download verified library from this SAME successful native run
        uses: actions/download-artifact@v4
        with:
          name: transvibe-whisper-arm64-api26
          path: native-incoming
      - name: Checkout Android source PR branch with narrowly scoped token
        uses: actions/checkout@v4
        with:
          repository: bingattban/TransVibe-android-
          ref: setup/transvibe-android-foundation
          path: android-target
          token: ${{ secrets.TRANSVIBE_ANDROID_DISPATCH_TOKEN }}
          persist-credentials: true
      - name: Verify tested source SHA, native hashes, JNI exports, ELF ABI and provenance
        shell: bash
        env:
          TESTED_ANDROID_SHA: ${{ needs.source-contract.outputs.app_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C android-target rev-parse HEAD)"
          test "$actual" = "$TESTED_ANDROID_SHA" || {
            echo "::error::Android PR changed after native compilation; rerun native build for the new SHA."
            exit 1
          }
          test "$(python3 -c 'import json;print(json.load(open("native-incoming/native-manifest.json"))["app_source_commit"])')" = "$actual" || {
            echo "::error::Native manifest does not match Android PR head."
            exit 1
          }
          python3 android-target/tools/verify_native_import.py --incoming native-incoming --app-root android-target/app
      - name: Commit only the validated ARM64 binary and provenance to Android PR
        shell: bash
        run: |
          set -euo pipefail
          git -C android-target config user.name 'github-actions[bot]'
          git -C android-target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C android-target add app/libs/arm64-v8a/libtransvibe_whisper.so app/libs/native-provenance.json
          if git -C android-target diff --cached --quiet; then
            echo 'Native binary already present and identical: no new commit.'
          else
            git -C android-target commit -m "native: bootstrap verified Whisper Tiny from SO run $GITHUB_RUN_ID"
            git -C android-target push origin HEAD:setup/transvibe-android-foundation
            echo 'Android PR updated. Its CI must pass JVM/native/signed Preview+Release gates before automatic merge.'
          fi

  auto-merge:
    name: Merge native PR only after JNI contract and actual ARM64 build succeed
    needs: [source-contract, build-arm64]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge only the tested source commit without bypassing protections
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$current" = "$EXPECTED_SHA" || { echo "::error::PR head changed"; exit 1; }
          gh pr merge "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"
      - name: Rebuild main and then dispatch verified native artifact
        shell: bash
        run: gh workflow run build-whisper-arm64.yml -R "$GITHUB_REPOSITORY" --ref main
